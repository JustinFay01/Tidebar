name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR or branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin Xcode so CI matches local development. The project format requires Xcode 27+.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift-format --version

      - name: Lint Swift sources
        run: scripts/lint.sh

  test:
    name: Build & Test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run unit tests
        run: scripts/test.sh --result-bundle build/TestResults.xcresult

      - name: Build Release
        run: scripts/build.sh Release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 14
